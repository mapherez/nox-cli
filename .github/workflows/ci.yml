name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-cli-ci-${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'NoX-CLI-Release:') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI work
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Recognize a version-only release request
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=$(node scripts/ci-policy.mjs classify "$GITHUB_SHA")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  policy:
    name: CI reuse policy tests
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node --test scripts/ci-policy.test.mjs

  native:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Native checks / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check release helper without publishing
        run: npm run test:release
      - name: Verify dependency checksums and module tidiness
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Check Go formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Vet and test
        run: |
          go vet ./...
          go test -mod=readonly ./...
      - name: Detect Go races
        if: runner.os == 'Linux'
        run: go test -race -mod=readonly ./...
      - name: Check compiled process and native terminal lifecycle
        run: python scripts/check_foundation.py
      - name: Test POSIX installer verification and cleanup
        if: runner.os != 'Windows'
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test Windows installer verification and cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_installers.ps1
      - name: Check native credential replacement and removal
        if: runner.os != 'Linux'
        env:
          NOX_CLI_TEST_NATIVE_VAULT: '1'
        run: go test -mod=readonly ./internal/credentials -run TestNativeVaultReplacement -count=1 -timeout=30s
      - name: Prepare isolated Linux Secret Service test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
      - name: Check Linux credential replacement and removal
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euo pipefail <<'NOX_VAULT_TEST'
          NOX_VAULT_TEST_DIR=$(mktemp -d)
          cleanup() { rm -rf -- "$NOX_VAULT_TEST_DIR"; }
          trap cleanup EXIT
          export XDG_DATA_HOME="$NOX_VAULT_TEST_DIR"
          printf "%s" "disposable-ci-vault-password" | gnome-keyring-daemon --unlock --components=secrets
          NOX_CLI_TEST_NATIVE_VAULT=1 go test -mod=readonly ./internal/credentials -run TestNativeVaultReplacement -count=1 -timeout=30s
          NOX_VAULT_TEST

  cross-build:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Six-target compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Cross-compile source checks
        run: python scripts/check_foundation.py --cross-build

  approved:
    name: CI approved
    needs: [plan, policy, native, cross-build]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every source gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
